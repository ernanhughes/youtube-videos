[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-videos-workflows"
version = "0.1.0"
description = "Plugin-first, evidence-linked technical lesson production from book chapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
zmq = ["pyzmq>=25,<28"]
dev = ["pytest>=8,<10", "pyzmq>=25,<28"]

[project.scripts]
youtube-videos = "youtube_videos.cli:main"

[project.entry-points."youtube_videos.plugins"]
# Third-party packages can register implementations here. Loading is allowlisted in config.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
youtube_videos = ["conf/*.yaml", "conf/workflow/*.yaml", "conf/events/*.yaml"]
